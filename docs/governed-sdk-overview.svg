    <path d="M80 1130H1520"/><path d="M80 1090H1520"/><path d="M80 1050H1520"/>
    <path d="M120 70V1130"/><path d="M1480 70V1130"/>
  </g>

  <text x="80" y="72" class="title">Governed Copilot SDK</text>
  <text x="80" y="106" class="subtitle">Policy controls which models and tools the agent may use; every consequential path crosses the enforcement boundary.</text>

  <!-- Policy authority -->
  <g filter="url(#shadow)">
    <rect x="455" y="135" width="530" height="150" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  </g>
  <g transform="translate(490 171)" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 0L45 8V25C45 40 35 51 24 57C13 51 3 40 3 25V8Z" fill="#ffedd5"/>
    <path d="M15 27L22 34L35 20"/>
  </g>
