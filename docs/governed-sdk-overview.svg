  <path d="M127 643L135 635L143 643L135 651Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="638" class="node-title">Custom agent</text>
  <text x="160" y="657" class="node-copy">Any planner or agent runtime</text>

  <rect x="110" y="680" width="255" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="129" y="706" class="node-title">+ Additional implementations</text>

  <rect x="110" y="748" width="255" height="83" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="129" y="771" class="node-title">Policy-bound session</text>
  <text x="129" y="793" class="node-copy">Public → Internal → Confidential</text>
  <text x="129" y="813" class="node-copy">Protection only increases per session</text>

  <!-- Central SDK and enforcement -->
  <g filter="url(#shadow)"><rect x="470" y="345" width="500" height="350" rx="10" fill="#111827" stroke="#0969da" stroke-width="3"/></g>
  <rect x="492" y="367" width="456" height="306" rx="7" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 7"/>
