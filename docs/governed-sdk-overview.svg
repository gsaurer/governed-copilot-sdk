<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Governed Copilot SDK overview</title>
  <desc id="desc">A Copilot SDK harness sits at the center. An in-process governance policy governs built-in and user-provided model routes, context assembly, and an extensible set of tools and data through a governed session enforcement boundary. User chat, autonomous agents, custom agent frameworks, and other implementations enter from the left; an evidence ledger is written below.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI', sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #4b5563; letter-spacing: 0; }
      .section { font: 700 14px 'Segoe UI', sans-serif; fill: #374151; letter-spacing: 1.4px; }
      .box-title { font: 700 20px 'Segoe UI', sans-serif; fill: #111827; letter-spacing: 0; }
      .box-copy { font: 400 14px 'Segoe UI', sans-serif; fill: #4b5563; letter-spacing: 0; }
      .core-title { font: 700 25px 'Segoe UI', sans-serif; fill: #ffffff; letter-spacing: 0; }
      .core-panel-title { font: 700 20px 'Segoe UI', sans-serif; fill: #ffffff; letter-spacing: 0; }
      .core-section { font: 700 14px 'Segoe UI', sans-serif; fill: #93c5fd; letter-spacing: 1.4px; }
      .core-copy { font: 400 14px 'Segoe UI', sans-serif; fill: #d1d5db; letter-spacing: 0; }
      .chip { font: 600 12px 'Segoe UI', sans-serif; fill: #dbeafe; letter-spacing: 0; }
      .node-title { font: 700 16px 'Segoe UI', sans-serif; fill: #111827; letter-spacing: 0; }
      .node-copy { font: 400 12px 'Segoe UI', sans-serif; fill: #6b7280; letter-spacing: 0; }
      .flow { fill: none; stroke: #0969da; stroke-width: 3; marker-end: url(#arrow-blue); }
      .policy-flow { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#arrow-amber); }
      .evidence-flow { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f8fafc"/>
  <path d="M0 0H1600V210C1335 170 1130 230 890 195C610 154 353 218 0 170Z" fill="#eef4fb"/>
