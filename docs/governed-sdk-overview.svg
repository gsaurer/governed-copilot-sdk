  <text x="184" y="499" class="box-title">Autonomous agents</text>
  <text x="184" y="522" class="box-copy">Goals • events • delegated work</text>

  <rect x="110" y="550" width="255" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M128 577L138 559L148 577Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
