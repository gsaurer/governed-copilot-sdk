  <circle cx="143" cy="424" r="24" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="143" cy="416" r="7" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M130 438C134 427 152 427 156 438" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <text x="184" y="419" class="box-title">User chat</text>
  <text x="184" y="442" class="box-copy">Prompt + selected profile</text>

