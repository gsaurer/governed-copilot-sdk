  <text x="603" y="454" class="core-title">Copilot SDK</text>
  <text x="603" y="479" class="core-copy">AGENT HARNESS • loop • sessions • streamed events</text>
  <rect x="520" y="525" width="400" height="112" rx="7" fill="#1f2937" stroke="#4b9be8" stroke-width="1.5"/>
  <g transform="translate(544 548)" fill="none" stroke="#93c5fd" stroke-width="2.5">
    <path d="M20 0L38 7V21C38 34 29 43 20 48C11 43 2 34 2 21V7Z"/>
    <path d="M12 23L18 29L29 17"/>
  </g>
  <text x="604" y="558" class="core-panel-title">GovernedSession enforcement</text>
  <text x="604" y="583" class="core-copy">Authorize before execution • update session labels</text>
  <text x="604" y="605" class="core-copy">Authorize model/tool route • record ledger evidence</text>
  <rect x="544" y="646" width="103" height="20" rx="10" fill="#1d4ed8"/><text x="558" y="660" class="chip">POLICY CHECK</text>
  <rect x="657" y="646" width="112" height="20" rx="10" fill="#1d4ed8"/><text x="671" y="660" class="chip">WATER MARK</text>
  <rect x="779" y="646" width="117" height="20" rx="10" fill="#1d4ed8"/><text x="793" y="660" class="chip">BOUNDED ACCESS</text>

