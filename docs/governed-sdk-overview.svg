  <text x="565" y="210" class="box-title">Policy configuration</text>
  <text x="565" y="237" class="box-copy">Profiles • classifications • model routes • tool permissions</text>
  <rect x="565" y="251" width="128" height="22" rx="11" fill="#ffedd5"/><text x="579" y="266" class="node-copy" fill="#92400e">config-defined</text>
  <rect x="703" y="251" width="112" height="22" rx="11" fill="#ffedd5"/><text x="716" y="266" class="node-copy" fill="#92400e">fail closed</text>
  <rect x="825" y="251" width="144" height="22" rx="11" fill="#ffedd5"/><text x="838" y="266" class="node-copy" fill="#92400e">monotonic upgrades</text>

  <!-- Agent implementations -->
