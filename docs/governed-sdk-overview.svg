  <text x="1095" y="971" class="section">GOVERNED CONTEXT • PROPOSED</text>
  <text x="1095" y="1002" class="box-title">Policy-controlled context assembly</text>
  <text x="1095" y="1027" class="box-copy">Prompts • history • retrieved documents • tool results</text>
  <text x="1095" y="1049" class="box-copy">Memory • skills • shared knowledge • agent messages</text>
